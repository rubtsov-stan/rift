[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rubtsov-stan/rift"
authors = ["Stanislav"]

[workspace.dependencies]
memchr = "2.8.3"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
rayon = "1.12.0"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
libc = "0.2.191"
ratatui = "0.30.2"
crossterm = "0.29.0"
bumpalo = "3.20.3"
itoa = "1.0.18"
crossbeam-utils = "0.8.23"
proptest = "1.12.0"
tempfile = "3.27.0"
divan = "0.1.21"
imara-diff = "0.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.bench]
inherits = "release"
