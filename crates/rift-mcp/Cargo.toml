[package]
name = "rift-mcp"
description = "MCP server for exploring a Rift diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mcp", "diff", "large-files", "csv", "ndjson"]
categories = ["command-line-utilities", "development-tools"]
authors.workspace = true

[dependencies]
rift-core.workspace = true
rift-session.workspace = true
rmcp.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
schemars.workspace = true

[dev-dependencies]
rift-core = { workspace = true, features = ["counting-alloc"] }
rmcp = { workspace = true, features = ["client"] }
serde_json.workspace = true
tempfile.workspace = true
rift-session = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true

[package.metadata.dist]
dist = true
