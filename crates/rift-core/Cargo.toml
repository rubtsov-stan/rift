[package]
name = "rift-diff-core"
description = "Memory-bounded line diff engine for very large files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["diff", "large-files", "patience-diff", "memory-limit", "text"]
categories = ["algorithms", "text-processing"]
authors.workspace = true

[lib]
name = "rift_core"

[features]
## Install-able global allocator that tracks current and peak heap.
counting-alloc = []

[dependencies]
memchr.workspace = true
xxhash-rust.workspace = true
rayon.workspace = true
thiserror.workspace = true
bumpalo.workspace = true
itoa.workspace = true
crossbeam-utils.workspace = true

[dev-dependencies]
rift-core = { path = ".", package = "rift-diff-core", features = ["counting-alloc"] }
proptest.workspace = true
divan.workspace = true
imara-diff.workspace = true

[lints]
workspace = true

[[bench]]
name = "scan"
harness = false
