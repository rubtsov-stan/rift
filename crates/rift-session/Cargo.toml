[package]
name = "rift-session"
description = "Live Rift diffs of file pairs, shared by rift serve and rift-mcp"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
## `test_hooks`: holds scans for tests. Only dev-dependencies enable it, so
## release builds never contain it.
test-hooks = []

[dependencies]
rift-core = { path = "../rift-core" }
rustix.workspace = true
thiserror.workspace = true

[dev-dependencies]
rift-core = { path = "../rift-core", features = ["counting-alloc"] }
rift-session = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true

[lints]
workspace = true
