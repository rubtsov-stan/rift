[package]
name = "rift-diff-session"
description = "Live Rift diffs of file pairs, shared by rift serve and rift-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["diff", "large-files", "session"]
categories = ["text-processing"]
authors.workspace = true

[lib]
name = "rift_session"

[features]
## `test_hooks`: holds scans for tests. Only dev-dependencies enable it, so
## release builds never contain it.
test-hooks = []

[dependencies]
rift-core.workspace = true
rustix.workspace = true
thiserror.workspace = true

[dev-dependencies]
rift-core = { workspace = true, features = ["counting-alloc"] }
rift-session = { path = ".", package = "rift-diff-session", features = ["test-hooks"] }
tempfile.workspace = true

[lints]
workspace = true
