[package]
name = "rift-diff"
description = "Diff text files of any size under a hard memory limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "rift"
path = "src/main.rs"

[features]
default = ["tui"]
# The terminal interface (`-i`, `rift tui`). Without it those exit 2.
tui = ["dep:rift-tui", "dep:ratatui"]

[dependencies]
rift-core = { path = "../rift-core", features = ["counting-alloc"] }
rift-tui = { path = "../rift-tui", optional = true }
ratatui = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
rift-gen = { path = "../rift-gen" }

[lints]
workspace = true

[package.metadata.deb]
name = "rift-diff"
section = "utils"
priority = "optional"
extended-description = """\
Rift compares text files of tens to hundreds of gigabytes under a hard \
heap limit and prints a unified diff."""
assets = [
    ["target/release/rift", "usr/bin/", "755"],
    ["../../man/rift.1", "usr/share/man/man1/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/rift-diff/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/rift-diff/", "644"],
]
