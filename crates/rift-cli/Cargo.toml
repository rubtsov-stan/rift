[package]
name = "rift-diff"
description = "Diff text files of any size under a hard memory limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "rift"
path = "src/main.rs"

[features]
default = ["tui"]
# The terminal interface (`-i`, `rift tui`). Without it those exit 2.
tui = ["dep:rift-tui", "dep:ratatui"]

[dependencies]
rift-core = { path = "../rift-core", features = ["counting-alloc"] }
rift-tui = { path = "../rift-tui", optional = true }
ratatui = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
rift-gen = { path = "../rift-gen" }

[lints]
workspace = true
