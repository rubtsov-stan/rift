[package]
name = "rift-gen"
description = "Deterministic test data generator for Rift"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rift-core = { path = "../rift-core" }
clap.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[dev-dependencies]
rift-core = { path = "../rift-core", features = ["counting-alloc"] }

# libtest runs its own thread beside the test and may allocate there, and
# this test asserts that reads allocate exactly nothing.
[[test]]
name = "synthetic_reads"
harness = false
