[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Built after the release exists, by the workflows of the same name, which the
# generated Release workflow calls.
post-announce-jobs = ["./deb", "./vscode", "./provenance", "./site-refresh"]
github-custom-job-permissions = { deb = { contents = "write" }, vscode = { contents = "write" }, provenance = { contents = "write", attestations = "read" }, site-refresh = { actions = "write" } }

# Build provenance for every release archive, checkable with `gh attestation verify`
github-attestations = true

# Third-party actions in the generated release workflow, pinned by commit.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
