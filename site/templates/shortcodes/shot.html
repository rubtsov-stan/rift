{#- A screenshot of the extension at 1280x759 CSS pixels, from editors/vscode/media/screens (copied by build.sh). -#}
<figure class="media" style="--ar:1280/759"><img src="{{ get_url(path='vscode-screens/' ~ name) | safe }}" width="1280" height="759" alt="{{ alt }}" loading="lazy" decoding="async"><figcaption>{{ caption }}</figcaption></figure>
