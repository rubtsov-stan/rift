name: CI

# A pull request branch runs CI once, from pull_request; push covers main.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request drops the run for its old head. Each run on
# main gets a group of its own: in a shared group a newer pending run would
# cancel an older pending one even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The runner tolerates YAML that GitHub's other parsers reject: an invalid
  # miri.yml ran on schedule but refused every manual run.
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ruby -ryaml -e 'ARGV.each { |f| YAML.parse_file(f) }' .github/workflows/*.yml .github/dependabot.yml
      # A job missing from ci-ok's needs would not hold a pull request back.
      - run: |
          ruby -ryaml -e 'j = YAML.load_file(".github/workflows/ci.yml")["jobs"]; m = j.keys - ["ci-ok"] - j["ci-ok"]["needs"]; abort "ci-ok does not need: #{m.join(", ")}" unless m.empty?'

  # Exceptions for the generated release.yml are in .github/actionlint.yaml.
  # Run scripts are checked with the runner's shellcheck.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        env:
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - run: shellcheck --version
      - run: '"$RUNNER_TEMP/actionlint" -color'

  # Every file the release commit bumps carries Cargo.toml's version.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/check-versions.sh

  # The protocol's schemas, the fixture and the mock server the VS Code
  # extension is tested against; uses the runner's Node, no packages.
  protocol-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node editors/vscode/test/check-mock.js

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm run test:unit
      # The extension tests run inside a VS Code window; xvfb gives it a display.
      - run: xvfb-run -a npm run test:vscode

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The fuzz crate is outside the workspace, so the jobs above never build
  # it. This builds it and replays every seed and saved crash through the
  # checks without libFuzzer; the nightly Fuzz run does the fuzzing.
  fuzz-replay:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg fuzzing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      # One thread: the heap checks read process-wide counters.
      - run: cargo test --manifest-path fuzz/Cargo.toml -- --test-threads=1

  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: compare.sh tells reordered output from changed output
        run: bench/compare-test.sh
      - run: cargo build --release -p rift-diff -p rift-gen
      - name: Summary and full diff of a 1 GiB pair stay under --mem
        run: bench/ci-mem.sh 1G 256M
      # The heap no budget counts weighs most at the smallest budgets.
      - name: Every mode stays under small --mem values, refusals included
        run: for mem in 64K 1M 4M; do bench/ci-mem.sh 16M "$mem" small; done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.97 check --workspace --all-targets

  no-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --no-default-features -p rift-diff
      - run: cargo test --no-default-features -p rift-diff

  # Miri runs nightly (miri.yml). A pull request that adds or changes a
  # line with `unsafe` in Rust code runs it here too.
  unsafe-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          base=$(git merge-base "$BASE" HEAD)
          if git diff -U0 "$base" HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep -q unsafe; then
            echo touched=true >> "$GITHUB_OUTPUT"
          fi

  miri:
    needs: unsafe-diff
    if: needs.unsafe-diff.outputs.touched == 'true'
    uses: ./.github/workflows/miri-run.yml

  # The check the main ruleset requires, with the Release plan. It always
  # reports, so a pull request never waits on a job that did not start; a job
  # skipped by its condition passes, a failed or cancelled one fails it.
  ci-ok:
    if: always()
    needs: [yaml, actionlint, versions, protocol-mock, vscode, check, fuzz-replay, memory, msrv, no-tui, unsafe-diff, miri]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        # Only success and skipped pass: a job that got no runner reports
        # "abandoned", which a check for failure and cancelled let through.
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case $r in success | skipped) ;; *) exit 1 ;; esac
          done
