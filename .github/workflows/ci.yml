name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The runner tolerates YAML that GitHub's other parsers reject: an invalid
  # miri.yml ran on schedule but refused every manual run.
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ruby -ryaml -e 'ARGV.each { |f| YAML.parse_file(f) }' .github/workflows/*.yml .github/dependabot.yml

  # The protocol's schemas, the fixture and the mock server the VS Code
  # extension is tested against; uses the runner's Node, no packages.
  protocol-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node editors/vscode/test/check-mock.js

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm run test:unit
      # The extension tests run inside a VS Code window; xvfb gives it a display.
      - run: xvfb-run -a npm run test:vscode

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p rift-diff -p rift-gen
      - name: Summary and full diff of a 1 GiB pair stay under --mem
        run: bench/ci-mem.sh 1G 256M

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.97 check --workspace --all-targets

  no-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --no-default-features -p rift-diff
      - run: cargo test --no-default-features -p rift-diff

  # Miri runs nightly (miri.yml). A branch or pull request that adds or
  # changes a line with `unsafe` in Rust code runs it here too.
  unsafe-diff:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          base=$(git merge-base "$BASE" HEAD)
          if git diff -U0 "$base" HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep -q unsafe; then
            echo touched=true >> "$GITHUB_OUTPUT"
          fi

  miri:
    needs: unsafe-diff
    if: needs.unsafe-diff.outputs.touched == 'true'
    uses: ./.github/workflows/miri-run.yml
