name: Miri

# Miri is slow, so it stays out of per-push CI: nightly, on demand, and on
# pull requests that touch rift-core.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/rift-core/**"
      - ".github/workflows/miri.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Unit tests only. scan, skeleton, diff, moves, keyed and the anchors
      # table test start rayon's pool, and rayon's crossbeam-epoch 0.9.21
      # trips a Stacked Borrows report inside its own code (internal.rs,
      # Local::element_of); they run under Tree Borrows below. sched's tests run
      # worker threads with timeouts that do not fit Miri's speed; the
      # integration tests all go through the skeleton. The full suite also
      # does not finish within the timeout under Miri.
      # proptest looks up its failure-persistence file through getcwd, which
      # Miri's isolation refuses; with isolation off, a few cases each.
      # alloc_small installs the counting allocator, rift-core's only unsafe
      # code, on a few KiB.
      - run: 'cargo +nightly miri test -p rift-core --lib --test alloc_small -- --skip scan:: --skip sched:: --skip skeleton:: --skip diff:: --skip moves:: --skip keyed:: --skip anchors::tests::many_samples'
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 8

  # The tests that start rayon's pool, under Tree Borrows: crossbeam-epoch's
  # known report is a Stacked Borrows one. One job per test filter. rayon's global
  # pool never shuts down, so its threads outlive the test process; ignoring
  # leaks lets Miri exit without waiting for them.
  miri-tree-borrows:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # diff does not finish within the timeout under Miri.
        filter: ["scan::", "skeleton::", "moves::", "keyed::", "anchors::tests::many_samples"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: 'cargo +nightly miri test -p rift-core --lib -- ${{ matrix.filter }}'
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-ignore-leaks
          PROPTEST_CASES: 8
