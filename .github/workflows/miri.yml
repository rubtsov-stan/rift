name: Miri

# Miri is slow, so it stays off the development path: nightly and on
# demand. CI runs it on a branch only when the branch touches a line with
# `unsafe`. A failing nightly run opens or updates one issue.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    uses: ./.github/workflows/miri-run.yml

  report:
    needs: miri
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Miri nightly failing"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN"
          else
            gh issue create --title "$title" --body "The nightly Miri run failed: $RUN"
          fi
