name: Debian packages

# Called by the Release workflow once the release exists (a dist post-announce
# job), so it runs on the tagged commit and checks out nothing an event
# supplies. A manual run takes the tag of an existing release instead.
on:
  workflow_call:
    inputs:
      plan:
        description: Passed by the Release workflow, not read here
        required: false
        type: string
      tag:
        description: Release tag; defaults to the tag that triggered the run
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        # Same glibc floor as the dist archives, which build on 22.04.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deb --version 3.8.0
      - run: cargo deb -p rift-diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.runner }}
          path: target/debian/*.deb
          if-no-files-found: error

  upload:
    needs: deb
    runs-on: ubuntu-latest
    # Only this job holds a write token, and it runs no code from the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: deb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          set -- deb/*.deb
          [ "$#" -eq 2 ]
          gh release upload "$TAG" "$@" --repo "$GITHUB_REPOSITORY" --clobber
