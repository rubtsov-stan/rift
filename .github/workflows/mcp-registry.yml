name: MCP Registry

# Builds the MCP bundle of rift-mcp from the release's own rift-mcp archives,
# attaches it to the release with the same provenance files as the archives,
# and publishes server.json to the MCP Registry as io.github.rubtsov-stan/rift-mcp.
# Called by the Release workflow once the release exists (a dist post-announce
# job). A manual run takes the tag of an existing release and only builds the
# bundle unless told to publish.
on:
  workflow_call:
    inputs:
      plan:
        description: Passed by the Release workflow, not read here
        required: false
        type: string
      tag:
        description: Release tag; defaults to the tag that triggered the run
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the bundle for, e.g. v0.3.4
        required: true
        type: string
      publish:
        description: Attach the bundle to the release and publish it to the MCP Registry
        type: boolean
        default: false

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.9
  # mcp-publisher_linux_amd64.tar.gz of that release.
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8

jobs:
  bundle:
    # lipo, for the universal macOS binary.
    runs-on: macos-latest
    permissions:
      contents: read
      attestations: read
    steps:
      # The workflow's own commit: the tag when called, the branch it was
      # started from when run by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bundle from the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/archives"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern 'rift-mcp-*.tar.xz'
          set -- "$dir"/rift-mcp-*.tar.xz
          [ "$#" -eq 4 ]
          # Only binaries the Release workflow built and attested go in.
          for f in "$@"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
          .github/scripts/mcpb-bundle.sh "$TAG" "$dir" out "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: out/
          if-no-files-found: error

  publish:
    needs: bundle
    # A run the Release workflow calls always publishes; a manual run only
    # when asked to.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    # The only job with a write token or an OIDC token: the attestation and
    # the registry login need the OIDC token, the upload needs contents.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: out
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: out/*.mcpb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          .github/scripts/provenance-assets.sh out "$GITHUB_REPOSITORY" '*.mcpb'
          gh release upload "$TAG" out/*.mcpb out/*.mcpb.sigstore.json out/*.mcpb.intoto.jsonl --repo "$GITHUB_REPOSITORY" --clobber
      - name: Install mcp-publisher
        run: |
          set -eu
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP Registry
        working-directory: out
        run: |
          set -eu
          "$RUNNER_TEMP/mcp-publisher" validate server.json
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
