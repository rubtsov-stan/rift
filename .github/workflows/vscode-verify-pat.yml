name: VS Code token check

# Checks that the VSCE_PAT secret can publish for the extension's publisher.
# Manual only; it packages and publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The pinned vsce from package-lock.json; install scripts are not needed.
      - run: npm ci --ignore-scripts
      - env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce verify-pat "$(node -p 'require("./package.json").publisher')"
