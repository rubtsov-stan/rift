name: Supply chain

on:
  push:
  pull_request:
  schedule:
    # New advisories appear without any change to this repository.
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action runs in its own container, which lacks the toolchain that
      # rust-toolchain.toml pins; a pinned cargo-deny on the runner does not.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked cargo-audit --version 0.22.2
      # Run directly rather than through an action, so the job needs no
      # write permission; it fails on any advisory.
      - run: cargo audit
