paths:
  # release.yml is generated by dist, which writes its post-announce jobs as
  # `uses: $/.github/workflows/<job>.yml`. GitHub accepts that form; actionlint
  # 1.7 knows only `./` and `owner/repo/...@ref`. The file cannot be edited by
  # hand, so only this one workflow-call message is ignored, only here.
  .github/workflows/release.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/[a-z]+\.yml" at "uses" is not following the format'
