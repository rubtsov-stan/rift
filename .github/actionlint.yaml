paths:
  # release.yml is generated by dist and cannot be edited by hand, so two
  # kinds of finding are ignored here and nowhere else:
  # - dist writes its post-announce jobs as `uses: $/.github/workflows/<job>.yml`.
  #   GitHub accepts that form; actionlint 1.7 knows only `./` and
  #   `owner/repo/...@ref`.
  # - shellcheck's SC2086 (unquoted variable) and SC2129 (repeated redirects)
  #   notes on dist's own run scripts: five of them as of dist 0.34.0.
  .github/workflows/release.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/[a-z]+\.yml" at "uses" is not following the format'
      - 'shellcheck reported issue in this script: SC2086:info:'
      - 'shellcheck reported issue in this script: SC2129:style:'
