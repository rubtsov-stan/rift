[graph]
all-features = true

[advisories]
# Yanked crates and unmaintained or unsound advisories fail the check too.
yanked = "deny"
ignore = [
  # chrono is unmaintained, not vulnerable. rift-mcp's rmcp requires it (3.9.0
  # and 3.10.0 have no feature to drop it) and enables schemars' chrono04.
  # https://rustsec.org/advisories/RUSTSEC-2026-0543. Remove with #55.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, not a vulnerability; pulled in by rmcp and schemars, see #55" },
]

[licenses]
# The project is MIT OR Apache-2.0, so only licenses that can be combined
# with it in a distributed binary are allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
# rift-diff and rift-tui are publishable and depend on sibling crates by path
# without a version. Cargo.toml belongs to another track; raise this back to
# "deny" once those dependencies carry a version or the crates stop being
# publishable.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
